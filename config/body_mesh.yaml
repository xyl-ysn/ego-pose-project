# Direct node name for the GPU node. Empty means do not pin to the old server.
nodeName: ""

nodeSelector: {}

affinity: {}
tolerations: []
runtimeClassName: ""

image:
  repository: reg.zikirobo.com/zata-platform/zata-model-human-pose-tool
  tag: dev-v1.0.0
  pullPolicy: Always
imagePullSecrets: []

replicas: 1

# Service startup is not finalized yet. Leave empty to use the Dockerfile
# placeholder; set these values when the worker entrypoint is decided.
command: []
args: []

modelData:
  # Local project checkout on this machine.
  hostPath: /home/opsuser/thk/xyl_ysn_project
  hostPathType: Directory
  readOnly: true
  external:
    subPath: exp
    mountPath: /app/external/human_pose_tool
  weights:
    subPath: exp
    mountPath: /app/weights/human_pose_tool

resources:
  limits:
    nvidia.com/gpu: 1

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

# Environment variables are rendered into a ConfigMap and loaded with envFrom.
# Keep values as strings because Kubernetes ConfigMap data is string-only.
env:
  SERVICE_NAME: "zata-model-human-pose-tool"
  SERVICE_VERSION: "1.0.0"
  MODEL_TYPE: "human_pose_tool"
  MODEL_NAMES: "EgoGVAE,GeoCalib,FoundationGeo"
  ZATA_MANAGER_BASE_URL: "http://10.9.103.101:31052"
  ZATA_MANAGER_POLL_INTERVAL: "3"
  ZATA_MANAGER_CALLBACK_TIMEOUT: "30"
  ZATA_MANAGER_PROGRESS_INTERVAL: "2"
  ZATA_MANAGER_FINAL_PROGRESS_RETRIES: "3"
  ZATA_MANAGER_FINAL_PROGRESS_RETRY_INTERVAL: "2"
  MAX_WORKERS: "1"
  GPU_CLEANUP_AFTER_TASK: "true"
  SIDECAR_ENABLED: "false"
  SIDECAR_DIR: ""
  LOG_LEVEL: "INFO"
  LOG_DETAILED_FORMAT: "false"
  LOG_ENQUEUE: "false"
  WORKER_LOG_FILE: ""
  VIDEO_CACHE_ROOT: "/tmp/zata-model-worker-cache"

config: &body_mesh_config
  runtime:
    device: cuda
    # CPU preprocessing only; set before imports in its child processes.
    # Existing OMP/MKL/OPENBLAS/etc. environment values take precedence.
    # 0 keeps library defaults. EGO_UNI_PREPROCESS_THREADS overrides this value.
    preprocess_threads: 1
    # Scoped to CPU model loading/FK/rotation export, restored before GPU operations.
    # 0 disables; EGO_UNI_TORCH_CPU_THREADS overrides this value.
    torch_cpu_threads: 1

  model_sources:
    egogvae_root: ../exp/EgoGVAE_release
    egoallo_root: ../exp/egoallo
    geocalib_root: ../exp/GeoCalib
    foundationgeo_root: ../exp/FoundationGeo

  model_weights:
    egogvae_checkpoint_path: ../exp/EgoGVAE_release/weights/_latest.pth
    egoallo_checkpoint_dir: ../exp/egoallo/egoallo_checkpoint_april13/checkpoints_3000000

    geocalib_pinhole_tar: ../exp/GeoCalib/weigths/pinhole.tar

    mano_left_pkl: model/MANO_LEFT.pkl
    mano_right_pkl: model/MANO_RIGHT.pkl

    smplh_npz_path: ../exp/EgoGVAE_release/weights/smplh/neutral/model.npz
    foundationgeo_model_pt: ../exp/FoundationGeo/weights/FoundationGeo.pt

  output_layout:
    tmp_dir_name: tmp
    egogvae_inputs_dir_name: egoallo_inputs
    egogvae_outputs_dir_name: egoallo_outputs
    egogvae_tmp_dir_name: egoallo_tmp
    assets_pointclouds_dir_name: assets/pointclouds
    assets_poses_dir_name: assets/poses
    final_scene_name: final_scene.ply
    egogvae_motion_name: egogvae_motion.npz
    pipeline_log_json_name: pipeline_run_log.json

    cleanup:
      tmp: false
      egogvae_inputs: false
      egogvae_tmp: false
      egoallo_outputs: false
      assets_pointclouds: false
      assets_poses: false

  hand_filter:
    # Assumes other people's hands are farther from the camera than the wearer's.
    enabled: true
    near_distance_ratio: 3.0
    min_support: 3
    # Match short gaps by geometry, including new source chunk IDs; never fill observations.
    max_gap_seconds: 0.6
    # Wrist step <= (1 + speed * elapsed_seconds) * wrist-to-middle-MCP length.
    max_speed_hand_lengths: 20.0
    # Symmetric camera-distance ratio to the last accepted observation, regardless of ID.
    max_distance_change_ratio: 1.5
    # Minimum runner-up / best ratio: distance at initialization, 1 + match error thereafter.
    ambiguity_ratio: 1.25
    # Applied only after a metric scale has been obtained; camera-to-wrist radius.
    max_camera_distance_m: 1.2

  hawor_extract:
    # Scale-estimation preprocessing only. EgoAllo/frontend use upstream
    # hands_30fps.parquet directly, bypassing 02/03 filtering/smoothing/gap fill.
    # 1 disables endpoint fading.
    soft_start_frames: 1
    soft_end_frames: 1
    min_output_alpha: 0.0
    drop_isolated: true
    min_track_len: 3
    trim_segment_edges: 0
    max_gap_fill: 0
    max_gap_endpoint_hand_ratio: 1.5
    # Keep each accepted HaWoR hand at its original VGGT-world position.
    smooth_window: 1
    smooth_mode: translation
    soft_start_geometry: false
    soft_start_anchor_max_gap: 45
    max_wrist_step_hand_ratio: 1.5
    local_mad_window: 7
    local_mad_multiplier: 6.0
    local_mad_min_samples: 4
    print_jump_stats: true

  hawor_stabilize:
    # 0 preserves upstream side labels and their corresponding MANO records.
    max_flip_dist_ratio: 0.0
    max_wrist_step_hand_ratio: 1.5
    local_mad_window: 7
    local_mad_multiplier: 6.0
    local_mad_min_samples: 4
    min_track_len: 3
    soft_start_frames: 1
    soft_end_frames: 1
    min_alpha_to_keep: 0.0
    duplicate_mode: keep_best

  hamer_build:
    # Interpolate cam_space MANO parameters from camera.parquet timestamps
    # to the upstream 30 FPS hand/camera timeline.
    mano_frame_key: frame_id
    cam_space_left_subdir: "0"
    cam_space_right_subdir: "1"

  geocalib:
    device: auto
    num_samples: 40
    min_confidence: 2500

    anchor_policy: top_k_best_uncertainty
    top_k_anchors: 5
    empty_policy: skip

    viz_enabled: false
    viz_dir_name: geocalib_viz
    viz_save_all_sampled: false
    viz_save_selected: false

  alignment:
    # 以下 geocalib_* 只在“没有真实 IMU”时生效。有真实 IMU 时走 real_sensor 段。
    use_geocalib_prior: true
    geocalib_vector_type: gravity
    geocalib_switch_angle_deg: 10.0
    geocalib_outlier_angle_deg: 15.0

    geocalib_precheck_height: true
    fallback_to_ransac_on_invalid_height: true

    # 这三项是相机(头)高度校验阈值，无 IMU 与有 IMU 两条路径共用。
    min_valid_camera_height_margin_factor: 2.0
    min_camera_above_floor_ratio: 0.99
    min_camera_p10_height_margin_factor: -2.0

  real_sensor:
    # --real-sensor-input 提供标定、IMU 或深度流时生效。
    # RGB 内参用于 FoundationGeo；episode depth zarr 按 frame_id 匹配相机标定。
    # auto 按 episode.json 中对应 modality 选择，双目设备可显式指定 camera_left/right。
    rgb_camera_stream_id: auto
    depth_camera_stream_id: auto

    # 有真实 IMU 时的重力对齐策略：
    # 1. 有真实 IMU 时不跑全局纯点云 RANSAC，也不回退到纯点云 RANSAC；
    # 2. 先按 imu_vector_type 解释 imu_gravity.txt；若有可匹配手部数据，则用
    #    camera_above_hand_ratio 校验正负号，小于 imu_min_camera_above_hand_ratio 时翻转；
    # 3. 只用 IMU 方向在最低相机高度以下搜索地面候选，按 2/5/8/12/18 分位顺序扫；
    # 4. 某个分位 cutoff 或拟合 level 不低于最低相机高度时，停止继续向上搜索；
    # 5. 每个分位内逐次拟合并移除平面，最多 8 个；该分位候选全部不合格后再进入下一分位；
    #    refine_floor_coarse_to_fine 仅用当前候选内点精修，不重新吸纳已移除平面或分位外点；
    # 6. 重估法向与 IMU 方向夹角 <= imu_max_refine_angle_deg，则接受该 refine 后的地面方向；
    # 7. 没有地面候选或所有候选角度超限时，固定使用 IMU 方向，以低处有支持的水平面
    #    （无平面时用去噪后的低处分位参考）确定原点；点云、相机、手和物体使用同一刚体变换。
    #    此时 accepted=false，保持输入尺度，跳过尺度估计和人体推理，输出空人体 NPZ。
    # 头部高度/地面低包络校验仍写日志和元数据，但在真实 IMU 模式下只做诊断，不阻断接受。
    # 日志统一带 [IMU] 前缀，和无 IMU 的 GeoCalib 日志区分开。

    # 重力方向取“最静止的一段”，不是整段中位数：
    # 头一转，相机系下的加速度方向就跟着转，整段中位数不对应任何一帧。
    # 判定静止用：加速度方向抖动 + 模长偏离重力值 + 陀螺仪静止程度；
    # 选中的窗口会按时间匹配到对应帧号写进 imu_gravity.txt 第一列，
    # 下游用那一帧的位姿把相机系向量转到世界系。
    imu_stationary_window_sec: 0.5
    imu_stationary_max_gyro: 0.25
    imu_stationary_max_dir_spread_deg: 3.0
    imu_stationary_max_norm_rel_dev: 0.05

    # imu_gravity.txt 先按 imu_vector_type 解释；若有可匹配手部数据，则用“相机/头部高度应高于手部高度”
    # 校验正负号。camera_above_hand_ratio 小于阈值时翻转；没有手部数据时保持 imu_vector_type 的方向。
    # up/upright = 文件向量就是上；gravity/down/g = 文件向量是重力向下，会取反成上。
    imu_vector_type: up
    imu_min_camera_above_hand_ratio: 0.8
    imu_outlier_angle_deg: 180.0

    # 点云法向偏离 IMU 的最大角度；超限先尝试同一低分位内其他平面，再进入下一分位。
    imu_max_refine_angle_deg: 2

    # 头部高度合理性判断阈值（全部是尺度无关的比例量）：
    # imu_max_head_height_rel_spread: 头高 (p90-p10)/median 上限，防止 IMU 轴倾斜导致头高漂移
    # imu_max_points_below_floor_ratio: 明显低于该平面的点云比例上限，防止把桌面/台面当地面
    # imu_min_head_span_ratio / imu_max_head_span_ratio: 头高占场景竖直跨度的合理区间，
    #   上限放宽是为了容忍“只重建出地面附近、竖直跨度很小”的浅场景
    imu_max_head_height_rel_spread: 0.75
    imu_max_points_below_floor_ratio: 0.05
    imu_min_head_span_ratio: 0.15
    imu_max_head_span_ratio: 2.50

    # 真实深度尺度估计（在对齐之后执行）。
    # 用已估计重力方向，逐帧反投影真实深度并拟合低处水平地面，
    # 再把每个有效深度帧匹配到原始 VGGT 轨迹对应帧，用该帧对齐后的相机高度求尺度。
    # null 自动读取解码后数组的单位元数据。缺少单位时必须显式填写；与元数据冲突会拒绝估计。
    # 米=1.0，毫米=0.001；不能再次应用 Zarr 存储 codec 的量化倍率。
    depth_unit_scale: null
    # 所有深度/质量数组共享的已解压时间块 LRU 上限（MiB，不含 codec 临时内存）。
    # 一组活动时间块超过上限时不读取，报告需增加预算或上游按时间重新分块。
    depth_cache_mb: 512
    # 补充设备特殊无效值，按 Zarr 解码后、换算成米之前的数值填写。
    # 自动合并元数据 invalid_depth_value(s)/_FillValue/missing_value；不默认猜测 65535。
    depth_invalid_values: []
    # 不假设室内/室外测距范围。已知设备有效测距范围时显式填米值。
    # null 只预过滤非有限/非正值和质量掩码；水平面成簇后再做簇内 MAD 去异常。
    depth_min_m: null
    depth_max_m: null
    # 可选同一 depth zarr 内、与 depth 同形状的数组；null 表示上游未提供。
    # validity > 0；confidence >= 下方阈值；disparity > 最小有效视差（像素）。
    depth_validity_array: null
    depth_confidence_array: null
    depth_confidence_min: 0.5
    depth_disparity_array: null
    depth_min_disparity_px: 0.0
    depth_floor_max_abs_height_m: null
    # 稀疏高度直方图：桶宽保持 3cm；只存非空桶，下面限制峰值查询的分块桶数。
    # 内存随输入点数增长，不随最大/最小高度跨度增长。
    depth_floor_max_histogram_bins: 4096
    # 真实地面只在少数帧出现时，增加时间覆盖率；同一候选簇按隐含尺度聚类。
    depth_scale_num_samples: 96
    depth_scale_cluster_rel_tol: 0.08
    depth_scale_min_support_frames: 3
    depth_scale_local_window: 15
    depth_scale_local_min_support_frames: 6

  metric_scale:
    enabled: true
    floor_z: 0.0

    # 最终写出 final_scene.ply 时做一次降采样。0 表示不降采样。
    # 02_apply_alignment_da3_geocalib.py 现在默认只输出 head_trajectory.npy，不再写中间 aligned_scene.ply。
    #点云降采样
    final_scene_output_voxel_size: 0

    # 无真实深度时的尺度估计策略：
    # 1. FoundationGeo 使用上游逐帧内参生成度量深度图
    # 2. 按真实深度路线沿重力方向寻找地面，得到相机绝对高度尺度
    # 3. 取 max(FoundationGeo 地面尺度, hand 尺度)
    # 4. 若缩放后 p90 头高超过 1.60 m，则将最终尺度压到 1.60 m
    max_p90_head_height: 1.65

    foundationgeo:
      enabled: true
      output_dir_name: foundationgeo_metric_scale

      # 深度图保存在 <output_dir>/tmp/foundationgeo_metric_scale/depth。
      num_samples: 64
      depth_scale_cluster_rel_tol: 0.08
      depth_scale_min_support_frames: 3
      device: cuda
      fp16: false
      resolution_level: 9

      # FoundationGeo 失败时继续使用 hand 尺度。
      strict: false

    hands:
      enabled: true
      min_valid_bones: 20
      max_relative_mad: 0.35
      min_scale: 0.05
      max_scale: 20.0

      bones:
        - name: wrist_middle_mcp
          i: 0
          j: 9
          length_m: 0.095

        - name: index_pinky_mcp
          i: 5
          j: 17
          length_m: 0.075

    frontend:
      enabled: true
      include_mesh: false

      # 这两个文件名现在可以从 YAML 改
      head_jsonl_name: head_trajectory_egoallo.jsonl
      hands_jsonl_name: hand_keypoints_egoallo.jsonl

  pose_validation:
    # 在 metric scale 之后、EgoGVAE 推理之前执行。
    # 检查 head trajectory 和 tabletop-floor 风险；失败时写空的
    # egogvae_outputs/merged_smoothed_vis.npz，并跳过 EgoGVAE 推理。
    enabled: true
    empty_npz_on_fail: true
    report_json_name: pose_validation_report.json
    floor_z: 0.0
    metric_scale_trusted: null

    head_height:
      p01_min_m: 0.0
      p99_max_m: 3.0
      p95_min_m: 0.80

  egogvae:
    device: cuda
    # Full 128-frame noncausal windows at stride 32. Continuity-aware Viterbi
    # selection picks one window per frame and blends source switches.
    window_size: 128
    window_stride: 32
    start_index: 0
    end_index: null
    floor_z: 0.0
    latent_mode: mean
    allow_tf32: true
    seed: 2025
    report_json_name: motion_quality_report.json

    # trajectory selection / stitching weights
    window_pos_center: 64.0
    window_pos_trusted_lo: 32.0
    window_pos_trusted_hi: 96.0
    window_pos_weight: 1.0
    contact_confidence_weight: 0.0
    rotation_weight: 1.0
    foot_position_weight: 50.0
    contact_jump_weight: 2.0
    switch_penalty: 5.0
    same_frame_rotation_weight: 1.0
    same_frame_foot_weight: 50.0
    same_frame_contact_weight: 2.0
    switch_rotation_threshold_deg: 15.0
    switch_foot_threshold_m: 0.12
    transition_region_min: 16
    transition_region_max: 32

  egoallo_refine:
    enabled: true
    guidance_mode: hamer_reproj2
    device: cuda
    target_segment_length: 1024
    context_frames: 36
    window_size: 128
    overlap_size: 32
    num_samples: 1
    random_seed: 2025
    # Noise-matched EgoGVAE leg/contact inputs. 0 disables the inference reference.
    lower_body_reference_strength: 1.0
    lower_body_reference_seed: 7819
    # Official soft guidance, including the world-wrist position weight.
    hamer_abspos_weight: 20.0
    # Reference shoulder reach: spatial hand guidance fades to its minimum at 1.35x arm length.
    # Finger pose guidance remains active; the reference shoulders never follow the solve.
    hand_reachability_fade_ratio: 0.35
    # Keep 5% of the original residual multiplier even for far-out-of-reach targets.
    hand_reachability_min_weight: 0.05
    # LM iteration caps per call; official defaults are inner=5, post=20.
    # Full-step guidance: checked on demo9/10/12/15/18; avoid last-20-only foot regression.
    inner_max_iters: 2
    # Counts actual DDIM iterations (currently 30), not training noise steps.
    # 0 means all iterations; 40 would also cover all 30. Frequency 1 keeps all calls.
    inner_last_steps: 0
    inner_step_frequency: 1
    post_max_iters: 16
    # Post runs only once at the end, if its last-step/frequency gate allows it.
    post_last_steps: 0
    post_step_frequency: 1
    # Fixed JAX time axis: target_segment_length + 2 * context_frames (1096).
    # Padding is masked out and cropped from the saved motion.
    bucket_t: auto
    # 0 pads each hand side to bucket_t, independent of observed hand counts.
    detection_bucket: 0
    # Symmetric five-frame filter, bounded per-joint correction; fingers unchanged.
    body_smoothing_max_deg: 5.0
    # Ground below a fixed world chest/head/arms; pelvis and lower spine may move.
    # 0 disables this grounding pass. All computations use egoallo_refine.device.
    grounding_max_iters: 200
    grounding_spine_max_deg: 8.0
    grounding_leg_max_deg: 12.0
    grounding_smoothing_seconds: 0.08
    # Both stages protect ankle/toe world positions and orientations relative
    # to the pre-grounding body. Limits apply to the total correction.
    grounding_foot_xy_max_m: 0.05
    grounding_foot_rotation_max_deg: 8.0
    # Final leg-only stabilization after grounding; root/torso/arms stay fixed.
    leg_max_iters: 250
    leg_max_correction_deg: 3.0
    contact_source: egogvae
    # Keep native soft HaWoR guidance; no additional arm IK.
    hand_refinement_max_deg: 0.0
    cache_npz_name: egoallo_hawor_final_cache.npz
    verbose: false
    report_json_name: egoallo_refine_report.json

  jax_guidance:
    compilation_cache:
      enabled: true
      # Relative paths are resolved under the project root.
      output_path: jax_cache
      reset_on_signature_mismatch: true
      signature_file: .egoallo_jax_cache_signature.json
      min_compile_time_secs: 0
      min_entry_size_bytes: -1
      enable_xla_caches: xla_gpu_per_fusion_autotune_cache_dir
      explain_cache_misses: false
      debug_log_modules: false
      # Prepare the original executable with lower().compile(), without dummy solves.
      # solve restores the legacy warmup for diagnostics; inference budgets are unchanged.
      prewarm_guidance: true
      warmup_mode: compile

  python_cache:
    redirect_pycache_to_tmp: false
    pycache_subdir: pycache
    cleanup_existing_scripts_pycache: true

# Also expose the algorithm config at the YAML top level for local runs:
#   python scripts/run_body_mesh.py --config config/body_mesh.yaml ...
<<: *body_mesh_config
